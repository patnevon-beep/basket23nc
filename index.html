<style id="css">
:root{--bg:#f4f1ec;--card:#fff;--ink:#1d1b19;--muted:#7a746c;--line:#e6e0d7;--ok:#2f9e44;--ko:#e03131;--kc:#e8590c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

#app{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(60px + env(safe-area-inset-bottom))}
h1{margin:0;font-size:28px}h2{font-size:19px;margin:18px 0 10px}h3{font-size:15px;margin:18px 0 8px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.card h2,.card h3{margin-top:0}
.top p{margin:2px 0 14px;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:13px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
label{display:block;font-size:14px;color:var(--muted);margin-bottom:10px}
input{display:block;width:100%;margin-top:4px;padding:12px;font-size:17px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}

.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}

.btn.ok{background:#e3f4e6;color:var(--ok)}.btn.ko{background:#fde8e8;color:var(--ko)}
.seg{display:flex;background:rgba(0,0,0,.07);border-radius:14px;padding:4px;gap:4px;margin-bottom:12px}

.row-between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.live-banner{display:flex;justify-content:space-between;align-items:center;gap:10px;border-left:5px solid var(--kc)}
.grow{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
.grow .pts{font-size:22px;font-weight:700}
.livehead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.timer{text-align:center;border-top:5px solid #adb5bd}
.timer.run{border-top-color:var(--ok)}
.clock{font-size:64px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.status{font-weight:600}
.score{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.box{background:var(--card);border-radius:12px;padding:10px 4px;text-align:center}
.box b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.box span{font-size:12px;color:var(--muted)}
.shot{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:6px 0}
.shot+.shot{border-top:1px solid var(--line)}
.shl{display:flex;flex-direction:column}
.shot .btn{padding:14px 10px;min-width:96px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.evb{position:relative;padding:16px 10px;text-align:left;font-size:15px;min-height:62px}
.evb.p{background:#e7f1fb;color:#1864ab}.evb.n{background:#fff0e6;color:#c2410c}
.evb .cnt{position:absolute;top:6px;right:8px;font-size:13px;background:rgba(255,255,255,.8);border-radius:8px;padding:1px 7px}
.ev{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
.ev:last-child{border-bottom:0}
.ev .gt{color:var(--muted);font-variant-numeric:tabular-nums;min-width:46px}
.ev.n{color:#c2410c}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.big-num{font-size:40px;font-weight:700;margin:0}
.chart{height:210px;position:relative}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--line)}

tbody tr{cursor:pointer}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.mbox{background:#fff;border-radius:16px;padding:18px;max-width:380px;width:100%}
.mrow{display:flex;gap:8px;justify-content:flex-end}

#toast.show{transform:translateX(-50%) translateY(0)}
.chk{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:16px;color:var(--ink);margin:0;cursor:pointer}.chk:last-child{border-bottom:0}.chk input{width:22px;height:22px;margin:0;flex:none;accent-color:var(--kc)}
.btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
textarea{width:100%;height:260px;font:12px/1.4 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:10px;padding:8px}
.note{background:#fff7db;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}

.btn{border-radius:14px}
.btn.primary{background:linear-gradient(135deg,var(--kc),var(--kc2));box-shadow:0 6px 16px -6px var(--kc)}

function shrink(file,M,q){return new Promise(function(res,rej){var img=new Image(),u=URL.createObjectURL(file);

 img.onerror=function(){URL.revokeObjectURL(u);rej()};img.src=u})}

function lev1(a,b){if(Math.abs(a.length-b.length)>1)return false;var i=0,j=0,d=0;while(i<a.length&&j<b.length){if(a[i]===b[j]){i++;j++}else{if(++d>1)return false;if(a.length>b.length)i++;else if(a.length<b.length)j++;else{i++;j++}}}return d+(a.length-i)+(b.length-j)<=1}

 while(i<t.length){var hit=null;
  for(var c=0;c<VCMD.length&&!hit;c++){var ph=VCMD[c][1],ok=true;for(var j=0;j<ph.length;j++){if(!t[i+j]||!vTok(t[i+j],ph[j])){ok=false;break}}if(ok)hit=VCMD[c]}

function saveKids(){
 keepKidInputs();var list=kedit.filter(function(k){return k.name.trim()});
 if(!list.length){toast('Scrivi almeno un nome');return}
 var used={};store.kids.forEach(function(k){used[k.id]=1});
 list.forEach(function(k,i){if(!k.id){var n=1;while(used['k'+n])n++;k.id='k'+n;used[k.id]=1}k.name=k.name.trim()});
 store.kids=list;buildKids();if(!KIDS[kid])kid=list[0].id;LS.set('bb_kid',kid);kedit=null;view={name:'home'};persist();
}

app.addEventListener('click',function(e){
 var b=e.target.closest('[data-act],[data-ev],[data-kid]');if(!b)return;
 if(b.dataset.kid){kid=b.dataset.kid;LS.set('bb_kid',kid);render();return}
 if(b.dataset.ev){if(live)addEvent(b.dataset.ev);return}
 var a=b.dataset.act,id=b.dataset.id;
 if(a==='home')go({name:'home'});
 else if(a==='stats'){if(b.dataset.kidset){kid=b.dataset.kidset;LS.set('bb_kid',kid)}go({name:'stats'})}
 else if(a==='resume')go({name:'live'});
 else if(a==='open')go({name:'game',id:id});
 else if(a==='toggle')toggleClock();
 else if(a==='undo')undo();
 else if(a==='undotype'){var k=b.dataset.k;if(live){for(var j=live.events.length-1;j>=0;j--){if((ALIAS[k]||[k]).indexOf(live.events[j].t)>=0){live.events.splice(j,1);saveLive();buzz();toast('↶ Annullato: '+EV[k].l);break}}renderLive()}}
 else if(a==='end')startFinish('end');
 else if(a==='discard')discard();
 else if(a==='delgame')delGame(id);
 else if(a==='sync')persist();
 else if(a==='settings')go({name:'settings'});
 else if(a==='savesettings')saveSettings(readChecks());
 else if(a==='defsettings')saveSettings(DEF.slice());
 else if(a==='export')doExport(b.dataset.who);
 else if(a==='finback'){var m=fin&&fin.mode,gid=fin&&fin.id;fin=null;go(m==='edit'?{name:'game',id:gid}:{name:'live'})}
 else if(a==='finsave')finSave();
 else if(a==='mood'){keepFinInputs();fin.mood=b.dataset.v===''?null:+b.dataset.v;var yy=window.scrollY;renderFinish();window.scrollTo(0,yy)}
 else if(a==='pdf')doPdf(id);
 else if(a==='pickth'){keepKidInputs();kedit[+b.dataset.i].theme=b.dataset.t;render()}
 else if(a==='addkid'){keepKidInputs();var tt=Object.keys(THEMES);kedit.push({id:null,name:'',theme:tt[kedit.length%tt.length]});render()}
 else if(a==='savekids')saveKids();
 else if(a==='mic'){if(voiceOn)voiceStop();else voiceStart()}
 else if(a==='voicehelp')voiceHelp();
 else if(a==='editstats')startEditStats(gameById(id));
 else if(a==='stplus')estStep(b.dataset.k,true);
 else if(a==='stminus')estStep(b.dataset.k,false);
 else if(a==='estsave')estSave();
 else if(a==='estback'){var gid=est&&est.id;est=null;go({name:'game',id:gid})}
 else if(a==='delev'){var ix=+b.dataset.i,ev=live&&live.events[ix];if(ev){live.events.splice(ix,1);saveLive();toast('Eliminato: '+EV[ev.t].l);renderLive()}}
 else if(a==='backup')doBackup();
 else if(a==='install'){if(deferredInstall){deferredInstall.prompt();deferredInstall.userChoice.then(function(){deferredInstall=null;render()})}}
 else if(a==='rmphoto')rmPhoto(+b.dataset.i);
 else if(a==='editgame')startFinish('edit',gameById(id));
});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&live&&live.runStart)askWake()});

try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){})}catch(e){}
idbAll().then(function(all){for(var k in all)PURL[k]=URL.createObjectURL(all[k])}).catch(function(){}).then(render);
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredInstall=e;if(view.name==='home')render()});
window.addEventListener('appinstalled',function(){deferredInstall=null;toast('App installata ✓');if(view.name==='home')render()});
})();
</script>
